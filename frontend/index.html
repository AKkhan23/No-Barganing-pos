<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#E60000" />
        <meta name="description" content="No Bargaining POS — Industrial-grade retail point of sale. Cloud-based POS system for retail stores with billing, inventory, accounting, and reporting." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="No Bargaining" />
        <meta name="robots" content="index, follow" />
        <meta property="og:title" content="No Bargaining POS" />
        <meta property="og:description" content="Cloud-based retail POS with billing, inventory, accounting & reporting." />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="No Bargaining POS" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>No Bargaining POS — Retail Point of Sale</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <style>
            /* Splash screen — visible instantly before React mounts */
            #splash {
                position: fixed; inset: 0; z-index: 99999;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                background: #fafafa; color: #18181b;
                font-family: 'Inter', system-ui, -apple-system, sans-serif;
                transition: opacity 0.4s ease;
            }
            #splash.hide { opacity: 0; pointer-events: none; }
            #splash .logo { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; color: #dc2626; margin-bottom: 0.5rem; }
            #splash .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; margin: 1.25rem 3px; animation: pulse 1.2s ease-in-out infinite; }
            #splash .dot:nth-child(2) { animation-delay: 0.2s; }
            #splash .dot:nth-child(3) { animation-delay: 0.4s; }
            #splash .sub { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #a1a1aa; margin-top: 0.25rem; }
            @keyframes pulse { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="splash">
            <div class="logo">No Bargaining</div>
            <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="sub">Loading POS Terminal…</div>
        </div>
        <div id="root"></div>
        <script>
            // Hide splash once React mounts (#root has content)
            new MutationObserver((_, obs) => {
                if (document.getElementById('root')?.children?.length > 0) {
                    document.getElementById('splash')?.classList.add('hide');
                    setTimeout(() => document.getElementById('splash')?.remove(), 500);
                    obs.disconnect();
                }
            }).observe(document.getElementById('root'), { childList: true });
        </script>
        <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
